apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-pipeline
spec:
  tasks:
    - name: test
      taskSpec:
        steps:
          - name: run-tests
            image: python:3.8
            script: |
              pip install nose
              nosetests

    - name: cleanup
      taskSpec:
        steps:
          - name: clean-workspace
            image: alpine:latest
            script: |
              echo "Cleaning up workspace..."
              rm -rf build/ dist/ *.egg-info
